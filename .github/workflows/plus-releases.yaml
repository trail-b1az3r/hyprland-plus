name: Releases

# Stable releases are created from PLUS_VERSION on BRANCH. Nightly releases remain
# independent and are replaced only when the source commit changes.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Also create the stable v<PLUS_VERSION> release
        required: true
        default: false
        type: boolean
      publish_nightly:
        description: Build or refresh the hyprland-plus-git nightly release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  BRANCH: halcyon-0.56.2

concurrency:
  group: plus-releases
  cancel-in-progress: false

jobs:
  stable:
    name: Publish stable hyprland-plus release
    if: github.event_name == 'schedule' || inputs.publish_stable == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          submodules: recursive

      - name: Work out the stable version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < PLUS_VERSION)"
          [[ "$ver" =~ ^[0-9]+([.][A-Za-z0-9]+)*$ ]] || {
            echo "::error::Invalid PLUS_VERSION: $ver"
            exit 1
          }
          tag="v$ver"
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists; refusing to overwrite a published stable release."
            exit 1
          fi

      - name: Build stable source archive
        run: scripts/release-source.sh "hyprland-plus-$VER" "$RUNNER_TEMP/release"

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          gh release create "$TAG" \
            "$out/hyprland-plus-$VER.tar.gz" \
            "$out/hyprland-plus-$VER.tar.gz.sha256" \
            --target "$SHA" \
            --latest \
            --title "hyprland-plus $VER" \
            --notes "Hyprland $(cat VERSION) with the Halcyon additions. Built from $BRANCH at commit ${SHA:0:12}. Release artifacts, including the precompiled Arch package, are attached by the Release artifacts workflow."

  nightly:
    name: Publish hyprland-plus-git
    if: github.event_name == 'schedule' || inputs.publish_nightly == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          submodules: recursive

      - name: Work out what to build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:12}"
          ver="$(tr -d '[:space:]' < PLUS_VERSION)"
          echo "SHA=$sha" >> "$GITHUB_ENV"
          echo "SHORT=$short" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "LABEL=hyprland-plus-git-$(date -u +%Y%m%d)-$short" >> "$GITHUB_ENV"
          echo "DATE_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

          skip=false
          if [[ "$EVENT" != "workflow_dispatch" ]]; then
            if gh release view hyprland-plus-git --json body --jq .body 2>/dev/null | grep -q "commit $short"; then
              skip=true
            fi
          fi
          echo "SKIP=$skip" >> "$GITHUB_ENV"

      - name: Build nightly source archive
        if: env.SKIP != 'true'
        run: scripts/release-source.sh "$LABEL" "$RUNNER_TEMP/release"

      - name: Replace nightly release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          gh release delete hyprland-plus-git --yes --cleanup-tag 2>/dev/null || true
          gh release create hyprland-plus-git \
            "$out/$LABEL.tar.gz" \
            "$out/$LABEL.tar.gz.sha256" \
            --target "$SHA" \
            --prerelease \
            --title "hyprland-plus-git ($DATE_UTC)" \
            --notes "Built from $BRANCH at $DATE_UTC. This is commit $SHORT, version $VER. Expect bugs; use the stable hyprland-plus release for daily use."
