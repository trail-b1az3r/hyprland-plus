name: Format tablet changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-tablet-changes
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # The Arch container does not include Git by default. Install it before
      # checkout so actions/checkout creates a real worktree instead of an archive.
      - name: Install Git before checkout
        run: pacman -Sy --noconfirm git

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          pacman -Syu --noconfirm --needed clang

      - name: Format tablet implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_DIR="/__w/$REPO_NAME/$REPO_NAME"
          if [[ ! -d "$REPO_DIR/.git" ]]; then
            echo "::error::Git worktree not found at $REPO_DIR"
            ls -la "/__w/$REPO_NAME" || true
            exit 1
          fi
          clang-format -i \
            "$REPO_DIR/src/managers/input/Tablets.cpp" \
            "$REPO_DIR/src/devices/Tablet.hpp" \
            "$REPO_DIR/tests/config/BlurVariants.cpp"

      - name: Commit formatting fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_DIR="/__w/$REPO_NAME/$REPO_NAME"
          git config --global --add safe.directory "$REPO_DIR"
          git -C "$REPO_DIR" rev-parse --show-toplevel
          if git -C "$REPO_DIR" diff --quiet; then
            echo "The tablet files are already formatted."
            exit 0
          fi
          git -C "$REPO_DIR" config user.name "github-actions[bot]"
          git -C "$REPO_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$REPO_DIR" add \
            src/managers/input/Tablets.cpp \
            src/devices/Tablet.hpp \
            tests/config/BlurVariants.cpp
          git -C "$REPO_DIR" commit -m "style(tablet): apply clang-format"
          git -C "$REPO_DIR" push origin HEAD:main
