name: Build man pages

on:
  workflow_dispatch:
  push:
    paths:
      - docs/**
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  main:
    name: Build man pages
    runs-on: ubuntu-latest
    steps:
    - name: Install deps
      run: sudo apt install pandoc

    # The repository has no PAT secret, so this used the empty token and failed. The job's own token can
    # push the generated pages; "permissions" above gives it write access to the repository.
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Build man pages
      run: make man

    - uses: stefanzweifel/git-auto-commit-action@v7
      name: Commit
      with:
        commit_message: "[gha] build man pages"
