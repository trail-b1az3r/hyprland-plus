name: Publish hyprland-plus packages to AUR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish AUR packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Validate release version and prepare both packages
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          VERSION="${RELEASE_TAG#v}"
          EXPECTED="$(tr -d '[:space:]' < PLUS_VERSION)"
          if [[ -z "$RELEASE_TAG" ]]; then VERSION="$EXPECTED"; fi
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "::error::Release tag ($VERSION) does not match PLUS_VERSION ($EXPECTED)."
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+([.][A-Za-z0-9]+)*$ ]] || {
            echo "::error::Invalid Arch pkgver: $VERSION"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/aur-packages/hyprland-plus" "$RUNNER_TEMP/aur-packages/oh-hyprland-plus"
          cp packaging/aur/PKGBUILD "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:packaging/aur/oh-hyprland-plus/PKGBUILD > "$RUNNER_TEMP/aur-packages/oh-hyprland-plus/PKGBUILD"
          python3 - packaging/aur/PKGBUILD "$RUNNER_TEMP/aur-packages/oh-hyprland-plus/PKGBUILD" <<'PY'
          import pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text()
          target_path = pathlib.Path(sys.argv[2])
          target = target_path.read_text()
          depends = re.search(r"(?ms)^depends=\(.*?^\)", source)
          if not depends:
              raise SystemExit("Could not copy runtime dependencies from the release PKGBUILD")
          target = re.sub(r"(?ms)^depends=\(.*?^\)", depends.group(0), target, count=1)
          target_path.write_text(target)
          PY

          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"
          if grep -q 'hyprland-plus::git+' "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"; then
            sed -i -E "s|(hyprland-plus::git\+https://github.com/trail-b1az3r/hyprland-plus.git#commit=)[0-9a-f]+|\1$RELEASE_SHA|" "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"
          else
            sed -i -E "s|#branch=[^\" ]+|#commit=$RELEASE_SHA|" "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"
          fi
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" "$RUNNER_TEMP/aur-packages/oh-hyprland-plus/PKGBUILD"
          grep -q "commit=$RELEASE_SHA" "$RUNNER_TEMP/aur-packages/hyprland-plus/PKGBUILD"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate .SRCINFO for both packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/aur-packages:/packages" \
            archlinux:base-devel bash -euc '
              useradd -m builder
              chown -R builder:builder /packages
              for dir in /packages/*; do
                su builder -c "cd \"$dir\" && makepkg --printsrcinfo > .SRCINFO"
                test -s "$dir/.SRCINFO"
              done
            '

      - name: Publish both AUR repositories
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_COMMIT_EMAIL: ${{ secrets.AUR_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" || -z "${AUR_COMMIT_EMAIL:-}" ]]; then
            echo "::error::Configure AUR_SSH_PRIVATE_KEY and AUR_COMMIT_EMAIL repository secrets."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          KEY_CONTENT="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          if [[ "$KEY_CONTENT" == *'\\n'* && "$KEY_CONTENT" != *$'\n'* ]]; then
            KEY_CONTENT="${KEY_CONTENT//\\\\n/$'\n'}"
          fi
          if [[ "$KEY_CONTENT" != *"-----BEGIN "* ]]; then
            DECODED_KEY="$(printf '%s' "$KEY_CONTENT" | base64 --decode 2>/dev/null || true)"
            if [[ "$DECODED_KEY" == *"-----BEGIN "* ]]; then KEY_CONTENT="$DECODED_KEY"; fi
          fi
          printf '%s\n' "$KEY_CONTENT" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          if ! ssh-keygen -y -f ~/.ssh/aur >/dev/null; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not a readable private key."
            exit 1
          fi
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes"

          for package in hyprland-plus oh-hyprland-plus; do
            work="$RUNNER_TEMP/aur-repo-$package"
            git clone "ssh://aur@aur.archlinux.org/$package.git" "$work"
            cp "$RUNNER_TEMP/aur-packages/$package/PKGBUILD" "$work/PKGBUILD"
            cp "$RUNNER_TEMP/aur-packages/$package/.SRCINFO" "$work/.SRCINFO"
            cd "$work"
            git config user.name "Hyprland Plus Release Bot"
            git config user.email "$AUR_COMMIT_EMAIL"
            if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
              echo "$package is already up to date."
              continue
            fi
            git add PKGBUILD .SRCINFO
            git commit -m "Update $package to $VERSION"
            git push origin master
          done
