name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build artifacts for (for example v0.57.2.p4)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "::error::A release event tag or manual tag input is required."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out release source and submodules
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release version
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXPECTED="$(tr -d '[:space:]' < PLUS_VERSION)"
          if [[ "$VERSION" != "$EXPECTED" ]]; then
            echo "::error::Tag $TAG does not match PLUS_VERSION ($EXPECTED)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create source archive
        run: scripts/release-source.sh "hyprland-plus-$VERSION" "$RUNNER_TEMP/release"

      - name: Build precompiled Arch package
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" packaging/aur/PKGBUILD
          if grep -q 'hyprland-plus::git+' packaging/aur/PKGBUILD; then
            sed -i -E "s|(hyprland-plus::git\\+https://github.com/trail-b1az3r/hyprland-plus.git#commit=)[0-9a-f]+|\\1$RELEASE_SHA|" packaging/aur/PKGBUILD
          else
            sed -i -E "s|#branch=[^\" ]+|#commit=$RELEASE_SHA|" packaging/aur/PKGBUILD
          fi
          grep -q "commit=$RELEASE_SHA" packaging/aur/PKGBUILD
          mkdir -p "$RUNNER_TEMP/arch-packages"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/arch-packages:/out" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm
              useradd -m builder
              chown -R builder:builder /src /out
              su builder -c "cd /src/packaging/aur && makepkg --syncdeps --noconfirm --cleanbuild"
              cp /src/packaging/aur/*.pkg.tar.zst /out/
            '
          PACKAGE="$(find "$RUNNER_TEMP/arch-packages" -maxdepth 1 -name 'hyprland-plus-*.pkg.tar.zst' -print -quit)"
          test -n "$PACKAGE"
          cp "$PACKAGE" "$RUNNER_TEMP/release/hyprland-plus-$VERSION-x86_64.pkg.tar.zst"

      - name: Upload artifacts to this repository's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            "$RUNNER_TEMP/release/hyprland-plus-$VERSION.tar.gz" \
            "$RUNNER_TEMP/release/hyprland-plus-$VERSION.tar.gz.sha256" \
            "$RUNNER_TEMP/release/hyprland-plus-$VERSION-x86_64.pkg.tar.zst" \
            --clobber
