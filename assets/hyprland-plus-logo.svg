<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b8"/>
      <stop offset="0.35" stop-color="#f5c542"/>
      <stop offset="0.7" stop-color="#c98a12"/>
      <stop offset="1" stop-color="#7a4e06"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The plus: a gold body with a darker edge, rounded at the corners -->
  <polygon points="176,56 336,56 336,176 456,176 456,336 336,336 336,456 176,456 176,336 56,336 56,176 176,176"
           fill="url(#gold)" stroke="#7a4e06" stroke-width="8" stroke-linejoin="round"/>

  <!-- Glossy glints on the upper arms -->
  <rect x="92" y="98" width="112" height="38" rx="19" fill="url(#glint)" opacity="0.8"/>
  <rect x="196" y="74" width="38" height="78" rx="19" fill="url(#glint)" opacity="0.7"/>

  <!-- Two sparkles -->
  <g filter="url(#glow)" fill="#ffffff">
    <path d="M420,66 Q420,110 464,110 Q420,110 420,154 Q420,110 376,110 Q420,110 420,66 Z"/>
    <path d="M96,398 Q96,424 122,424 Q96,424 96,450 Q96,424 70,424 Q96,424 96,398 Z"/>
  </g>
</svg>
